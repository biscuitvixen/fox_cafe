# Foundry hosting stack on atlas
#
# Architecture:
#   Internet → Hetzner Firewall (80/443 only) → caddy-security
#     ├── Auth portal at auth.bluefox.cafe (Discord OAuth)
#     ├── Foundry game instances (Discord-gated via forward auth)
#     ├── Uptime Kuma (Discord-gated)
#     └── Dozzle log viewer (Discord-gated)
#
# All inter-container traffic goes over the `web` bridge network.
# Foundry containers do NOT publish ports - only Caddy reaches them.

# Default log driver settings, applied to every service via YAML anchor.
# Without this, json-file logs grow unbounded and eventually fill the VPS disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Defence-in-depth defaults applied to every service. Shrinks the blast
# radius if any container is ever compromised:
#   - no-new-privileges: blocks setuid binaries from escalating
#     (e.g. attacker can't `sudo` even if a setuid binary exists in image)
#   - cap_drop ALL: strips every Linux capability (raw sockets, mount,
#     ptrace, net_admin, etc). Services that need a specific cap back
#     re-add it via `cap_add` (currently caddy and filebrowser).
# Merge into a service with `<<: *hardening`.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

# Shared config for every Foundry game container. Per-game services merge
# this with `<<: *foundry-base` and override the bits that differ
# (container_name, hostname, license env vars, data volume).
#
# Image tag note: felddy uses `:14` as the rolling major-14 tag, which tracks
# the latest v14 patch (e.g. 14.360 → 14.361 → 14.x) but won't jump to
# v15. Pin to `:14.360` if you want to freeze the minor too. Foundry runs
# as UID 1000 inside the container, which matches the default first-user
# UID on the VPS - bind-mounted data ends up owned by the host user.
x-foundry-base: &foundry-base
  <<: *hardening
  image: felddy/foundryvtt:14.365
  restart: unless-stopped
  init: true
  # Memory: hard cap at 4g, soft floor at 512m (kernel keeps ≥512m resident
  # under pressure). oom_score_adj=-500 means if the host ever truly runs
  # out of memory the support containers (kuma/dozzle/filebrowser) get
  # killed before any Foundry session does.
  # Not made read_only: felddy's entrypoint writes to /home/foundry and
  # other runtime paths during license activation / world load. Hardening
  # is applied to the support services where the blast radius matters.
  mem_limit: 4g
  mem_reservation: 512m
  oom_score_adj: -500
  logging: *default-logging
  networks: [web]

# Env vars that are identical across every game. Per-game `environment:`
# blocks merge this in via `<<: *foundry-env` and add their own DM creds,
# license, and hostname on top.
x-foundry-env: &foundry-env
  FOUNDRY_PROXY_SSL:  "true"   # Foundry emits https:// URLs (Caddy terminates TLS)
  FOUNDRY_PROXY_PORT: "443"
  FOUNDRY_TELEMETRY:  "false"
  TZ:                 Europe/London

services:
  # ─────────────────────────────────────────────────────────────────────
  # Reverse proxy + TLS + Discord OAuth gate
  # ─────────────────────────────────────────────────────────────────────
  caddy:
    <<: *hardening
    # caddy-security ships Caddy + the security/auth plugins compiled in.
    # We can't use the standard caddy:2-alpine image because we need the
    # `security {}` Caddyfile directive which comes from the plugin.
    #
    # Pinned to an exact patch version. Upstream only publishes patch tags
    # (v1.0.41, v1.0.40, ...) - no rolling `v1` tag last we checked. To
    # bump: read the authcrunch release notes, change the tag below, then
    # `docker compose pull caddy && docker compose up -d caddy`.
    image: ghcr.io/authcrunch/authcrunch:v1.0.43
    container_name: caddy
    restart: unless-stopped
    logging: *default-logging
    # Run an init (tini) as PID 1 so orphaned children get reaped. Caddy as
    # PID 1 does not reap, so every healthcheck (wget follows Caddy's HTTP->HTTPS
    # 308 to the TLS leg) leaves an orphaned BusyBox `ssl_client` zombie. Without
    # a reaper these pile up ~1 per 30s and exhaust the pids cgroup (~9273) after
    # ~3 days, after which nothing in the container can fork - the healthcheck's
    # own `sh -c` fails and the container is marked unhealthy while caddy itself
    # keeps serving. tini reaps the orphans so pids.current stays flat (~11).
    # (BusyBox wget in this image has no --max-redirect, so we can't stop the
    # redirect being followed at the source; reaping is the fix.)
    init: true
    # Relative CPU weight (default is 1024). Only matters under contention:
    # if Foundry pegs a CPU during a busy session, Caddy still gets twice
    # the slice, so TLS handshakes and auth redirects stay snappy. No effect
    # when CPU is idle - Foundry can use everything.
    cpu_shares: 2048
    # Memory + OOM priority. Caddy is the public entrypoint - if it dies,
    # nothing is reachable, so we protect it almost as strongly as Foundry.
    mem_limit: 1g
    mem_reservation: 128m
    oom_score_adj: -300
    # Read-only rootfs: the only things Caddy needs to write to are /data
    # (ACME state) and /config (autosave) - both already volumes. Everything
    # else, including /tmp, gets a tmpfs so a compromised process can't
    # drop tools or modify the image layer.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # NET_BIND_SERVICE: bind 80/443.
    # CHOWN/FOWNER/DAC_OVERRIDE/SETUID/SETGID: the authcrunch entrypoint
    # fixes ownership on /data and may drop privileges before running
    # caddy. Without these, existing cert files (owned UID 1000 from a
    # prior image version) become unreadable on next start.
    cap_add: [NET_BIND_SERVICE, CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # All site content (apex, dnd, errors, previews, shared assets) comes
      # from the release-symlink layout published by ~/bluefox.cafe/deploy.sh.
      - /srv/bluefox.cafe:/srv/bluefox.cafe:ro
      - ./data/caddy/data:/data        # ACME certs + state. BACK THIS UP.
      - ./data/caddy/config:/config
      # JSON access logs, tailed read-only by crowdsec for HTTP scenarios.
      # Named volume (not bind mount) so the path exists with correct
      # ownership before Caddy starts writing.
      - caddy_logs:/var/log/caddy
    environment:
      ACME_EMAIL:               ${ACME_EMAIL}
      CLOUDFLARE_API_TOKEN:     ${CLOUDFLARE_API_TOKEN}
      JWT_SHARED_KEY:           ${JWT_SHARED_KEY}
      DISCORD_CLIENT_ID:        ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET:    ${DISCORD_CLIENT_SECRET}
      DISCORD_GUILD_DEMIPLANE:  ${DISCORD_GUILD_DEMIPLANE}
      DISCORD_GUILD_EXAMPLE_2:  ${DISCORD_GUILD_EXAMPLE_2}
      DISCORD_ADMIN_USER_ID:    ${DISCORD_ADMIN_USER_ID}
      AUTH_PORTAL_URL:          ${AUTH_PORTAL_URL}
      FORBIDDEN_URL:            ${FORBIDDEN_URL}
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O /dev/null --server-response http://localhost 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────
  # Foundry game instances
  # ─────────────────────────────────────────────────────────────────────
  # One container per game. Shared config lives in the `x-foundry-base` and
  # `x-foundry-env` anchors at the top of this file - each game block only
  # has to specify what's actually unique to that game.

  # foundry-test:
  #   <<: *foundry-base
  #   container_name: foundry-test
  #   environment:
  #     <<: *foundry-env
  #     FOUNDRY_USERNAME:    ${FOUNDRY_USERNAME_BISCUIT}
  #     FOUNDRY_PASSWORD:    ${FOUNDRY_PASSWORD_BISCUIT}
  #     FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_BISCUIT}
  #     FOUNDRY_ADMIN_KEY:   ${FOUNDRY_ADMIN_KEY_BISCUIT}
  #     FOUNDRY_HOSTNAME:    test.bluefox.cafe
  #   volumes:
  #     - ./data/foundry-test:/data

  foundry-demiplane:
    <<: *foundry-base
    container_name: foundry-demiplane
    environment:
      <<: *foundry-env
      FOUNDRY_USERNAME:    ${FOUNDRY_USERNAME_ZANDER}
      FOUNDRY_PASSWORD:    ${FOUNDRY_PASSWORD_ZANDER}
      FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_ZANDER}
      FOUNDRY_ADMIN_KEY:   ${FOUNDRY_ADMIN_KEY_ZANDER}
      FOUNDRY_HOSTNAME:    demiplane.bluefox.cafe
    volumes:
      - ./data/foundry-demiplane:/data
      # Shared asset library - single copy on disk, read-only here so a game
      # can reference but never modify it. Writes go through filebrowser.
      - ./data/shared-assets:/data/Data/shared-assets:ro

  foundry-beastworld:
    <<: *foundry-base
    container_name: foundry-beastworld
    environment:
      <<: *foundry-env
      FOUNDRY_USERNAME:    ${FOUNDRY_USERNAME_RISUNA}
      FOUNDRY_PASSWORD:    ${FOUNDRY_PASSWORD_RISUNA}
      FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_RISUNA}
      FOUNDRY_ADMIN_KEY:   ${FOUNDRY_ADMIN_KEY_RISUNA}
      FOUNDRY_HOSTNAME:    beastworld.bluefox.cafe
    volumes:
      - ./data/foundry-beastworld:/data
      # Shared asset library - see foundry-demiplane above.
      - ./data/shared-assets:/data/Data/shared-assets:ro

  # To add a game: copy a block above, swap the suffix, add matching
  # FOUNDRY_*_<NAME> vars to .env, add the Caddyfile site block, and add
  # the Uptime Kuma monitor (point it at the internal docker hostname).

  # ─────────────────────────────────────────────────────────────────────
  # Monitoring
  # ─────────────────────────────────────────────────────────────────────
  uptime-kuma:
    <<: *hardening
    image: louislam/uptime-kuma:2.4.0
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    mem_reservation: 64m
    oom_score_adj: 500
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    # Kuma's entrypoint uses `setpriv` to set the run user - needs SETUID
    # and SETGID even when staying as root. Without these the container
    # crash-loops on `setgroups: Operation not permitted`.
    cap_add: [SETUID, SETGID]
    volumes:
      - ./data/uptime-kuma:/app/data
    networks: [web]

  # Filebrowser - shared across all games. Per-user scoping is configured
  # inside filebrowser itself (Settings → Users), not at the mount layer.
  # Each game's Data dir is mounted under /srv/<game>/ so you can scope
  # a user to e.g. /srv/demiplane and they only see that game's data.
  #
  # First-run setup (one-time):
  #   mkdir -p ./data/filebrowser
  #   touch ./data/filebrowser/database.db   # must exist as a file before first start
  #   docker compose up -d filebrowser
  #   docker compose logs filebrowser        # prints the initial admin password
  # Then log in, change the admin password, and create per-user accounts
  # with `Scope` set to the game subfolder they're allowed to touch.
  filebrowser:
    <<: *hardening
    image: filebrowser/filebrowser:v2.63.18
    container_name: filebrowser
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    mem_reservation: 32m
    oom_score_adj: 500
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=1000,gid=1000
    user: "1000:1000"   # match foundry UID so writes don't end up root-owned
    cap_add: [NET_BIND_SERVICE]   # bind :80 as UID 1000
    volumes:
      - ./data/filebrowser/database.db:/database.db
      - ./data/filebrowser/settings.json:/config/settings.json:ro
      - ./data/foundry-demiplane/Data:/srv/demiplane
      - ./data/foundry-beastworld/Data:/srv/beastworld
      # Shared asset library - read-write here: filebrowser is the one
      # controlled door for people to add/remove shared assets. The Foundry
      # containers mount this same dir read-only.
      - ./data/shared-assets:/srv/shared-assets
    networks: [web]

  # Docker socket proxy - sits between Dozzle and /var/run/docker.sock and
  # only forwards the read-only endpoints Dozzle actually needs. Without
  # this, anything that can talk to Dozzle's network is one HTTP call away
  # from full root on the host (the `:ro` bind mount is not a real defence
  # - the daemon itself doesn't enforce read-only over a Unix socket).
  #
  # Dozzle needs: CONTAINERS (list), EVENTS (stream), LOGS (read), INFO,
  # VERSION. Everything else (EXEC, BUILD, IMAGES write, etc.) stays off.
  # Lives on its own bridge network so nothing else in the stack can reach
  # it - only Dozzle is attached.
  docker-socket-proxy:
    <<: *hardening
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: docker-socket-proxy
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: 64m
    mem_reservation: 16m
    oom_score_adj: 500
    read_only: true
    # haproxy needs /run for its pid/socket file; /tmp for general scratch.
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /run:size=8m,mode=755
    environment:
      CONTAINERS: "1"
      EVENTS:     "1"
      LOGS:       "1"
      INFO:       "1"
      VERSION:    "1"
      # IMAGES: read-only GET on /images/* so Diun can inspect local image
      # digests to diff against the registry. Stays GET-only because POST=0
      # below. Shared with Dozzle, which simply never calls this endpoint.
      IMAGES:     "1"
      # Everything below is off by default in the upstream image; listed
      # explicitly so future-you knows they were considered, not forgotten.
      POST:       "0"
      EXEC:       "0"
      BUILD:      "0"
      COMMIT:     "0"
      VOLUMES:    "0"
      NETWORKS:   "0"
      SERVICES:   "0"
      TASKS:      "0"
      SWARM:      "0"
      NODES:      "0"
      SECRETS:    "0"
      CONFIGS:    "0"
      SESSION:    "0"
      DISTRIBUTION: "0"
      PLUGINS:    "0"
      SYSTEM:     "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket_proxy]
    # /_ping is allowed by default in tecnativa/docker-socket-proxy (PING=1)
    # and is the canonical "daemon reachable" probe - safe to hit, exposes
    # nothing sensitive. busybox wget ships in the Alpine base.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dozzle:
    <<: *hardening
    image: amir20/dozzle:v10.6.11
    container_name: dozzle
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: 128m
    mem_reservation: 32m
    oom_score_adj: 500
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    # Wait for the proxy to be healthy, not just started. Without
    # service_healthy Dozzle races the proxy on `docker compose up` and
    # logs a stream of connection errors until the proxy finishes booting.
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      # Talk to the proxy over TCP instead of mounting the host socket.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    networks: [web, socket_proxy]
    # Dozzle ships a built-in healthcheck subcommand, not active by default?
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # Diun - Docker Image Update Notifier
  # ─────────────────────────────────────────────────────────────────────
  # Updates are still applied manually for stability:
  #   docker compose pull <svc> && docker compose up -d <svc>
  # Diun replaces the old "subscribe to upstream release feeds" chore: it
  # watches every running container's image against its registry and pings a
  # Discord channel webhook when a newer digest/tag lands. It never pulls or
  # restarts anything itself. State lives in the diun_data volume so each new
  # version is announced exactly once.
  #
  # Reaches the Docker API through the shared socket-proxy (read-only; needs
  # IMAGES=1 there to read local image digests). Reaches registries over the
  # `web` network - the socket_proxy net is internal, so it can't egress.
  #
  # The Discord webhook is NOT the auth OAuth app: it's a standalone channel
  # webhook URL (Channel ▸ Integrations ▸ Webhooks), unrelated to
  # DISCORD_CLIENT_ID/SECRET. Revoke it independently without touching auth.
  diun:
    <<: *hardening
    image: crazymax/diun:4.33.0
    container_name: diun
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: 128m
    mem_reservation: 32m
    oom_score_adj: 500
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    environment:
      TZ: Europe/London
      LOG_LEVEL: info
      # What/when to check.
      DIUN_WATCH_SCHEDULE:            "0 8 * * *"   # daily 08:00 Europe/London
      DIUN_WATCH_FIRSTCHECKNOTIF:     "false"       # stay quiet on first boot
      DIUN_PROVIDERS_DOCKER:          "true"
      DIUN_PROVIDERS_DOCKER_ENDPOINT: tcp://docker-socket-proxy:2375
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"  # every container, no labels
      # Watch each repo's tag list for newer versions, not just the pinned
      # tag's digest. includeTags = 3-part semver only (drops latest/nightly/sha).
      DIUN_DEFAULTS_WATCHREPO:        "true"
      DIUN_DEFAULTS_SORTTAGS:         "semver"
      DIUN_DEFAULTS_MAXTAGS:          "1"
      DIUN_DEFAULTS_INCLUDETAGS:      '^v?\d+\.\d+\.\d+$'
      # How to notify.
      DIUN_NOTIF_DISCORD_WEBHOOKURL:  ${DIUN_DISCORD_WEBHOOK}
    volumes:
      - diun_data:/data
    networks: [web, socket_proxy]
    # Diun has no listening port and no health subcommand, so liveness is
    # simply "is the serve process alive". pgrep -x matches the process name
    # exactly (docker-init is PID 1; the diun serve child is what matters).
    healthcheck:
      test: ["CMD", "pgrep", "-x", "diun"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────
  # CrowdSec - log analysis + Local API
  # ─────────────────────────────────────────────────────────────────────
  # Reads Caddy's JSON access log, runs HTTP scenarios (scanning, bruteforce,
  # CVE probes), and serves decisions over LAPI to a host-side firewall
  # bouncer that drops banned IPs in nftables before they reach Docker.
  #
  # LAPI is bound to 127.0.0.1 only - the host bouncer reaches it via the
  # loopback-published port, nothing on the public internet ever touches it.
  #
  # First-run setup (one-time):
  #   docker compose up -d crowdsec
  #   docker compose exec crowdsec cscli capi register     # community blocklist
  #   docker compose exec crowdsec cscli bouncers add firewall-bouncer
  #     # ^ copy the printed API key into /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml on the host
  crowdsec:
    <<: *hardening
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: crowdsec
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 64m
    oom_score_adj: 500
    # Rootfs read-only; crowdsec writes only to its data + config volumes
    # and needs scratch space for its unix socket / lockfiles.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run:size=8m,mode=755
    # The crowdsec entrypoint runs as root, symlinks GeoIP databases from
    # the image into /var/lib/crowdsec/data, fixes ownership on the bind
    # mounts, and drops to UID 1000 (matching the GID env below) before
    # exec'ing the daemon. Each cap maps to one of those steps:
    #   DAC_OVERRIDE: write into bind-mounted dirs owned by 1000:1000
    #   CHOWN/FOWNER: chown/chmod the data + config dirs on first boot
    #   SETUID/SETGID: drop privileges before running crowdsec itself
    # Without these, the entrypoint crash-loops on the first `ln` call.
    cap_add: [DAC_OVERRIDE, CHOWN, FOWNER, SETUID, SETGID]
    environment:
      # Hub items installed on first boot. Keep this list in sync with what
      # `cscli collections list` shows - removing an entry here does NOT
      # uninstall it from the data volume.
      # caddy:    parser for Caddy JSON access logs + HTTP scanning/bruteforce scenarios
      # http-cve: matchers for known CVE exploit URLs (Log4Shell, path traversal, WP, etc)
      # whitelists: postoverflow that prevents banning RFC1918 / loopback / link-local
      #             - critical, without it an internal misconfigured probe can ban itself
      COLLECTIONS: "crowdsecurity/caddy crowdsecurity/http-cve"
      # Don't ship usage telemetry to the hub.
      DISABLE_ONLINE_API: "false"   # keep CAPI on for the community blocklist
      GID: "1000"
    volumes:
      # Bind-mounted (not named volume) so the SQLite decisions DB and the
      # machine identity end up under ./data/ alongside everything else the
      # backup script snapshots. Losing this loses ban history + CAPI registration.
      - ./data/crowdsec/data:/var/lib/crowdsec/data
      # Bind-mounted so acquis.yaml, profiles.yaml, and any custom scenarios
      # / whitelists you write live on the host fs and get backed up. Edit
      # acquis.yaml here directly after first boot.
      - ./data/crowdsec/config:/etc/crowdsec
      # Caddy's access logs, read-only. Named volume (ephemeral - rolled at
      # 100MB / kept 5 - nothing here is worth backing up).
      - caddy_logs:/var/log/caddy:ro
    # LAPI on loopback only. The host firewall-bouncer connects here.
    # NEVER bind this to 0.0.0.0 - LAPI has no auth on its bind address,
    # only on the bouncer/agent registration tokens. Hetzner's cloud firewall
    # would also block it, but defence in depth: loopback bind makes LAPI
    # unreachable from the public internet even if the cloud firewall is
    # ever misconfigured.
    ports:
      - "127.0.0.1:8080:8080"
    # Dedicated isolated network. crowdsec doesn't need to reach any other
    # container (the host bouncer talks to it via the published loopback
    # port, not over docker), and nothing else needs to reach crowdsec.
    # `internal: true` means the network has no gateway to the internet -
    # see the network definition at the bottom of this file.
    networks: [crowdsec]
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  # Shared between caddy (writer) and crowdsec (reader). Named volume so
  # docker sets ownership on first create instead of us managing a host
  # path - logs are ephemeral (rolled at 100MB / kept 5) so nothing here
  # needs to land in the backup script.
  caddy_logs:
    name: foundry_caddy_logs

  # Diun's bbolt database - tracks which image versions it has already
  # announced so each update pings once. Small and rebuildable (worst case
  # after a wipe: one duplicate round of notifications), so not backed up.
  diun_data:
    name: foundry_diun_data

networks:
  web:
    driver: bridge
    name: foundry_web   # explicit name so we don't get foundry-stack_web

  # Isolated network shared by Dozzle, Diun, and the socket proxy.
  # `internal: true` blocks outbound traffic from these containers to the
  # internet - the proxy has no business calling out, and it removes one
  # path for an attacker who lands inside it.
  socket_proxy:
    driver: bridge
    name: foundry_socket_proxy
    internal: true

  # Dedicated network for crowdsec. Nothing else attaches - the host bouncer
  # reaches LAPI via the published 127.0.0.1:8080 port, not over docker.
  # NOT marked `internal: true` because crowdsec needs outbound HTTPS to
  # api.crowdsec.net (CAPI - community blocklist sync) and hub.crowdsec.net
  # (collection / scenario updates). Marking it internal would silently
  # disable those without breaking the container.
  crowdsec:
    driver: bridge
    name: foundry_crowdsec