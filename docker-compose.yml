# Foundry hosting stack on atlas
#
# Architecture:
#   Internet → Hetzner Firewall (80/443 only) → caddy-security
#     ├── Auth portal at auth.bluefox.cafe (Discord OAuth)
#     ├── Foundry game instances (Discord-gated via forward auth)
#     ├── Uptime Kuma (Discord-gated)
#     └── Dozzle log viewer (Discord-gated)
#
# All inter-container traffic goes over the `web` bridge network.
# Foundry containers do NOT publish ports - only Caddy reaches them.

# Default log driver settings, applied to every service via YAML anchor.
# Without this, json-file logs grow unbounded and eventually fill the VPS disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared config for every Foundry game container. Per-game services merge
# this with `<<: *foundry-base` and override the bits that differ
# (container_name, hostname, license env vars, data volume).
#
# Image tag note: felddy uses `:14` as the rolling major-14 tag - Watchtower
# will update within v14 (e.g. 14.360 → 14.361 → 14.x) but won't jump to
# v15. Pin to `:14.360` if you want to freeze the minor too. Foundry runs
# as UID 1000 inside the container, which matches the default first-user
# UID on the VPS - bind-mounted data ends up owned by the host user.
x-foundry-base: &foundry-base
  image: felddy/foundryvtt:14
  restart: unless-stopped
  init: true
  mem_limit: 2g
  logging: *default-logging
  networks: [web]

# Env vars that are identical across every game. Per-game `environment:`
# blocks merge this in via `<<: *foundry-env` and add their own DM creds,
# license, and hostname on top.
x-foundry-env: &foundry-env
  FOUNDRY_PROXY_SSL:  "true"   # Foundry emits https:// URLs (Caddy terminates TLS)
  FOUNDRY_PROXY_PORT: "443"
  FOUNDRY_TELEMETRY:  "false"
  TZ:                 Europe/London

services:
  # ─────────────────────────────────────────────────────────────────────
  # Reverse proxy + TLS + Discord OAuth gate
  # ─────────────────────────────────────────────────────────────────────
  caddy:
    # caddy-security ships Caddy + the security/auth plugins compiled in.
    # We can't use the standard caddy:2-alpine image because we need the
    # `security {}` Caddyfile directive which comes from the plugin.
    #
    # Pinned to an exact version (NOT :latest) and excluded from Watchtower.
    # Reason: this container is the auth gate for everything else. A bad
    # update at 05:00 UTC would silently take the whole stack offline.
    # Upstream only publishes patch tags (v1.0.41, v1.0.40, ...) - no rolling
    # `v1` tag last we checked, so auto-tracking minors isn't possible via
    # image pinning. To bump: read the authcrunch release notes, change the
    # tag below, then `docker compose pull caddy && docker compose up -d caddy`.
    image: ghcr.io/authcrunch/authcrunch:v1.0.41
    container_name: caddy
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging: *default-logging
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/homepage:/srv/homepage:ro     # public landing page
      - ./caddy/dnd:/srv/dnd:ro               # gated dnd landing page
      - ./caddy/shared:/srv/shared:ro         # shared theme assets, served at bluefox.cafe/shared/*
      - ./data/caddy/data:/data        # ACME certs + state. BACK THIS UP.
      - ./data/caddy/config:/config
    environment:
      ACME_EMAIL:               ${ACME_EMAIL}
      JWT_SHARED_KEY:           ${JWT_SHARED_KEY}
      DISCORD_CLIENT_ID:        ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET:    ${DISCORD_CLIENT_SECRET}
      DISCORD_GUILD_DEMIPLANE:  ${DISCORD_GUILD_DEMIPLANE}
      DISCORD_GUILD_EXAMPLE_2:  ${DISCORD_GUILD_EXAMPLE_2}
      DISCORD_ADMIN_USER_ID:    ${DISCORD_ADMIN_USER_ID}
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O /dev/null --server-response http://localhost 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────
  # Foundry game instances
  # ─────────────────────────────────────────────────────────────────────
  # One container per game. Shared config lives in the `x-foundry-base` and
  # `x-foundry-env` anchors at the top of this file - each game block only
  # has to specify what's actually unique to that game.

  # foundry-test:
  #   <<: *foundry-base
  #   container_name: foundry-test
  #   environment:
  #     <<: *foundry-env
  #     FOUNDRY_USERNAME:    ${FOUNDRY_USERNAME_BISCUIT}
  #     FOUNDRY_PASSWORD:    ${FOUNDRY_PASSWORD_BISCUIT}
  #     FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_BISCUIT}
  #     FOUNDRY_HOSTNAME:    test.bluefox.cafe
  #   volumes:
  #     - ./data/foundry-test:/data

  foundry-beastworld:
    <<: *foundry-base
    image: felddy/foundryvtt:13 # This game is still on v13, pinned to the latest v13 patch
    container_name: foundry-beastworld
    environment:
      <<: *foundry-env
      FOUNDRY_USERNAME:    ${FOUNDRY_USERNAME_RISUNA}
      FOUNDRY_PASSWORD:    ${FOUNDRY_PASSWORD_RISUNA}
      FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_RISUNA}
      FOUNDRY_HOSTNAME:    beastworld.bluefox.cafe
    volumes:
      - ./data/foundry-beastworld:/data

  foundry-starwars:
    <<: *foundry-base
    container_name: foundry-starwars
    environment:
      <<: *foundry-env
      FOUNDRY_USERNAME:    ${FOUNDRY_USERNAME_BISCUIT}
      FOUNDRY_PASSWORD:    ${FOUNDRY_PASSWORD_BISCUIT}
      FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_BISCUIT}
      FOUNDRY_HOSTNAME:    starwars.bluefox.cafe
    volumes:
      - ./data/foundry-starwars:/data

  # To add a game: copy a block above, swap the suffix, add matching
  # FOUNDRY_*_<NAME> vars to .env, add the Caddyfile site block, and add
  # the Uptime Kuma monitor (point it at the internal docker hostname).

  # ─────────────────────────────────────────────────────────────────────
  # Monitoring
  # ─────────────────────────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./data/uptime-kuma:/app/data
    networks: [web]

  # Filebrowser - shared across all games. Per-user scoping is configured
  # inside filebrowser itself (Settings → Users), not at the mount layer.
  # Each game's Data dir is mounted under /srv/<game>/ so you can scope
  # a user to e.g. /srv/starwars and they only see that game's data.
  #
  # First-run setup (one-time):
  #   mkdir -p ./data/filebrowser
  #   touch   ./data/filebrowser/database.db
  #   docker compose up -d filebrowser
  #   docker logs filebrowser   # prints the initial admin password
  # Then log in, change the admin password, and create per-user accounts
  # with `Scope` set to the game subfolder they're allowed to touch.
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    logging: *default-logging
    user: "1000:1000"   # match foundry UID so writes don't end up root-owned
    volumes:
      - ./data/filebrowser/database.db:/database.db
      - ./data/filebrowser/settings.json:/.filebrowser.json:ro
      - ./data/foundry-beastworld/Data:/srv/beastworld
      - ./data/foundry-starwars/Data:/srv/starwars
    networks: [web]

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      # :ro is critical - Dozzle only reads from the docker socket.
      # Without :ro, this container effectively has root on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]

  # ─────────────────────────────────────────────────────────────────────
  # Auto-updates
  # ─────────────────────────────────────────────────────────────────────
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: watchtower
  #   restart: unless-stopped
  #   logging: *default-logging
  #   environment:
  #     WATCHTOWER_CLEANUP: "true"           # remove old images after update
  #     WATCHTOWER_SCHEDULE: "0 0 5 * * *"   # 05:00 UTC daily (matches skypaw)
  #     WATCHTOWER_INCLUDE_RESTARTING: "true"
  #     WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_DISCORD_WEBHOOK}
  #     WATCHTOWER_NOTIFICATIONS: shoutrrr
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

  # ─────────────────────────────────────────────────────────────────────
  # CrowdSec - commented out, future addition
  # ─────────────────────────────────────────────────────────────────────
  # crowdsec:
  #   image: crowdsecurity/crowdsec:latest
  #   container_name: crowdsec
  #   restart: unless-stopped
  #   environment:
  #     COLLECTIONS: "crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/linux"
  #     GID: "1000"
  #   volumes:
  #     - crowdsec_data:/var/lib/crowdsec/data
  #     - crowdsec_config:/etc/crowdsec
  #     # Will need to share Caddy's log volume read-only for parsing
  #   networks: [web]

networks:
  web:
    driver: bridge
    name: foundry_web   # explicit name so we don't get foundry-stack_web