<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>bluefox.cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/shared/theme.js"></script>
    <link rel="stylesheet" href="/shared/theme.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="font-sans">
    <div id="app" class="flex items-center justify-center min-h-screen p-6">
        <main class="w-full max-w-md text-center">
            <div class="w-24 h-24 mx-auto mb-5 rounded-full flex items-center justify-center text-4xl shadow-float ring-1 ring-white/10"
                 style="background: linear-gradient(135deg, #497bd6 0%, #24d962 100%);">
                🦊
            </div>
            <h1 class="text-2xl font-bold tracking-tight mb-1">bluefox.cafe</h1>
            <p class="text-white/60 text-sm mb-8">{{ tagline }}</p>

            <nav class="flex flex-col gap-3">
                <a v-for="link in links"
                   :key="link.href"
                   :href="resolveUrl(link.href)"
                   :class="[
                       'group relative block px-5 py-3.5 rounded-xl font-medium',
                       'shadow-float transition-all duration-200',
                       'hover:-translate-y-0.5 hover:shadow-lift',
                       link.primary
                           ? 'bg-belly text-white hover:brightness-110'
                           : 'bg-sides text-white ring-1 ring-white/5 hover:ring-eyes/50',
                   ]">
                    <span class="inline-flex items-center gap-2">
                        <span v-if="link.icon" class="text-lg">{{ link.icon }}</span>
                        {{ link.label }}
                        <span v-if="link.primary" class="transition-transform group-hover:translate-x-1">→</span>
                    </span>
                </a>
            </nav>
        </main>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    tagline: 'Hosting, gaming, and bits and pieces.',
                    links: [
                        { label: 'DnD',     href: 'https://dnd.bluefox.cafe', primary: true },
                        { label: 'GitHub',  href: 'https://github.com/',  icon: '🐙' },
                        { label: 'Discord', href: 'https://discord.com/', icon: '💬' },
                    ],
                };
            },
            methods: {
                resolveUrl(url) { return devUrls.resolve(url); },
            },
        }).mount('#app');
    </script>
</body>
</html>
