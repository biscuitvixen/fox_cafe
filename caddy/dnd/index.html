<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DnD · bluefox.cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://bluefox.cafe/shared/theme.js"></script>
    <link rel="stylesheet" href="https://bluefox.cafe/shared/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="font-sans">
    <div id="app" class="max-w-3xl mx-auto px-6 py-10">

        <!-- Header / hero -->
        <header class="hero-card relative overflow-hidden rounded-3xl mb-10 p-8 ring-1 ring-white/10 shadow-float">
            <div class="orb-eyes absolute -top-16 -right-16 w-56 h-56 rounded-full opacity-55 blur-3xl"></div>
            <div class="orb-belly absolute -bottom-16 -left-16 w-56 h-56 rounded-full opacity-50 blur-3xl"></div>

            <div class="relative text-center">
                <div class="flex justify-center mb-5">
                    <span class="text-6xl text-eyes glow-eyes"><i class="fa-solid fa-dice-d20"></i></span>
                </div>
                <h1 class="text-5xl font-bold tracking-tight mb-3">DnD</h1>
                <!-- <p class="text-white/65 text-sm leading-relaxed max-w-sm mx-auto mb-5">
                    Your games are protected - only players with the right roles can access each campaign.
                </p> -->
                <div class="flex items-center justify-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-eyes shadow-[0_0_10px_rgba(36,217,98,0.8)] animate-[pulse-dot_2.5s_ease-in-out_infinite]"></span>
                    <span class="text-xs uppercase tracking-[0.2em] text-white/60">authenticated</span>
                </div>
            </div>
        </header>

        <!-- Games - full-width prominent cards -->
        <section class="mb-10">
            <h2 class="text-xs uppercase tracking-[0.2em] text-white/40 mb-3 px-1">Games</h2>
            <div class="flex flex-col gap-3">
                <a v-for="game in games"
                   :key="game.href"
                   :href="game.href"
                   class="group relative block overflow-hidden rounded-2xl bg-sides ring-1 ring-white/5
                          shadow-float transition-all duration-200
                          hover:-translate-y-0.5 hover:shadow-lift hover:ring-eyes/40">
                    <!-- Left accent stripe - belly blue, fades to nothing -->
                    <div class="absolute left-0 top-0 bottom-0 w-1"
                         style="background: linear-gradient(180deg, #497bd6, #24d962);
                                opacity: 0.7;"></div>
                    <div class="flex items-center gap-5 p-6 pl-7">
                        <div class="text-4xl">{{ game.icon }}</div>
                        <div class="min-w-0 flex-1">
                            <div class="font-semibold text-lg">{{ game.name }}</div>
                            <div class="text-sm text-white/55 mt-0.5">{{ game.desc }}</div>
                        </div>
                        <div class="text-white/30 group-hover:text-eyes group-hover:translate-x-1 transition-all text-xl">→</div>
                    </div>
                </a>
            </div>
        </section>

        <!-- Tools - member-accessible utilities -->
        <section class="mb-10">
            <h2 class="text-xs uppercase tracking-[0.2em] text-white/40 mb-3 px-1">Tools</h2>
            <div class="flex flex-col gap-1.5">
                <a v-for="tool in tools"
                   :key="tool.href"
                   :href="tool.href"
                   class="group flex items-center gap-3 px-4 py-2.5 rounded-lg
                          bg-sides/40 ring-1 ring-white/5
                          hover:bg-sides hover:ring-white/10 transition-all duration-150">
                    <div class="text-base w-5 text-center">{{ tool.icon }}</div>
                    <div class="font-medium text-sm">{{ tool.name }}</div>
                    <div class="text-xs text-white/40 truncate">{{ tool.desc }}</div>
                    <div class="ml-auto text-white/30 group-hover:text-eyes transition-colors text-sm">→</div>
                </a>
            </div>
        </section>

        <!-- Ops - compact admin list -->
        <section class="mb-10">
            <h2 class="text-xs uppercase tracking-[0.2em] text-white/40 mb-3 px-1 flex items-center gap-2">
                Ops
                <span class="text-[10px] normal-case tracking-wide text-eyes/70">admin</span>
            </h2>
            <div class="flex flex-col gap-1.5">
                <a v-for="tool in ops"
                   :key="tool.href"
                   :href="tool.href"
                   class="group flex items-center gap-3 px-4 py-2.5 rounded-lg
                          bg-sides/40 ring-1 ring-white/5
                          hover:bg-sides hover:ring-white/10 transition-all duration-150">
                    <div class="text-base w-5 text-center">{{ tool.icon }}</div>
                    <div class="font-medium text-sm">{{ tool.name }}</div>
                    <div class="text-xs text-white/40 truncate">{{ tool.desc }}</div>
                    <div class="ml-auto text-white/30 group-hover:text-eyes transition-colors text-sm">→</div>
                </a>
            </div>
        </section>

        <!-- <p class="text-xs text-white/35 text-center">
            "Access denied" on a service means your Discord roles don't include it.
        </p> -->
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    games: [
                        { name: 'Demiplane',  icon: '⚔️', desc: 'Foundry VTT campaign', href: 'https://demiplane.bluefox.cafe' },
                        { name: 'Beastworld', icon: '🐾', desc: 'Foundry VTT campaign', href: 'https://beastworld.bluefox.cafe' },
                    ],
                    tools: [
                        { name: 'Files', icon: '📁', desc: 'Shared module & asset library', href: 'https://files.bluefox.cafe' },
                    ],
                    ops: [
                        { name: 'Uptime Kuma',  icon: '💓', desc: 'Service health',     href: 'https://kuma.bluefox.cafe' },
                        { name: 'Dozzle',       icon: '📜', desc: 'Container logs',     href: 'https://logs.bluefox.cafe' },
                    ],
                };
            },
        }).mount('#app');
    </script>
</body>
</html>
