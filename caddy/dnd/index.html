<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DnD · bluefox.cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg:      '#1e1e28',
                        card:    '#30303a',
                        accent:  '#0c83d5',
                        accent2: '#24d962',
                    },
                    boxShadow: {
                        float: '0 10px 30px -8px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.3)',
                        lift:  '0 18px 40px -12px rgba(0,0,0,0.6), 0 4px 10px rgba(12,131,213,0.18)',
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-bg text-white antialiased min-h-screen font-sans">
    <div id="app" class="max-w-3xl mx-auto px-6 py-10">
        <!-- Header / hero banner -->
        <header class="relative overflow-hidden rounded-3xl mb-10 p-8 ring-1 ring-white/10 shadow-float"
                style="background:
                    linear-gradient(135deg, rgba(12,131,213,0.28) 0%, rgba(36,217,98,0.18) 100%),
                    #30303a;">
            <div class="absolute -top-12 -right-12 w-48 h-48 rounded-full opacity-30 blur-2xl"
                 style="background: radial-gradient(circle, #24d962 0%, transparent 70%);"></div>
            <div class="absolute -bottom-12 -left-12 w-48 h-48 rounded-full opacity-30 blur-2xl"
                 style="background: radial-gradient(circle, #0c83d5 0%, transparent 70%);"></div>

            <div class="relative">
                <div class="flex items-center gap-2 mb-3">
                    <span class="inline-block w-2 h-2 rounded-full bg-accent2 shadow-[0_0_10px_rgba(36,217,98,0.8)]"></span>
                    <span class="text-xs uppercase tracking-[0.2em] text-white/60">signed in</span>
                </div>
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-4xl">🎲</span>
                    <h1 class="text-4xl font-bold tracking-tight">DnD</h1>
                </div>
                <p class="text-white/70 text-sm">
                    Your campaigns and tools.
                    Back to <a href="https://bluefox.cafe" class="text-accent2 hover:text-white transition-colors underline decoration-white/30 underline-offset-4">bluefox.cafe</a>.
                </p>
            </div>
        </header>

        <!-- Games - prominent cards -->
        <section class="mb-10">
            <h2 class="text-xs uppercase tracking-[0.2em] text-white/40 mb-3 px-1">Games</h2>
            <div class="grid gap-3 sm:grid-cols-2">
                <a v-for="game in games"
                   :key="game.href"
                   :href="game.href"
                   class="group relative block p-5 rounded-2xl bg-card ring-1 ring-white/5
                          shadow-float transition-all duration-200
                          hover:-translate-y-0.5 hover:shadow-lift hover:ring-accent/40">
                    <div class="flex items-start gap-3">
                        <div class="text-2xl">{{ game.icon }}</div>
                        <div class="min-w-0">
                            <div class="font-semibold text-base">{{ game.name }}</div>
                            <div class="text-sm text-white/55 mt-0.5">{{ game.desc }}</div>
                        </div>
                        <div class="ml-auto text-white/30 group-hover:text-accent transition-colors">→</div>
                    </div>
                </a>
            </div>
        </section>

        <!-- Ops - compact admin list -->
        <section class="mb-10">
            <h2 class="text-xs uppercase tracking-[0.2em] text-white/40 mb-3 px-1 flex items-center gap-2">
                Ops
                <span class="text-[10px] normal-case tracking-wide text-accent2/70">admin</span>
            </h2>
            <div class="flex flex-col gap-1.5">
                <a v-for="tool in ops"
                   :key="tool.href"
                   :href="tool.href"
                   class="group flex items-center gap-3 px-4 py-2.5 rounded-lg
                          bg-card/40 ring-1 ring-white/5
                          hover:bg-card hover:ring-white/10 transition-all duration-150">
                    <div class="text-base w-5 text-center">{{ tool.icon }}</div>
                    <div class="font-medium text-sm">{{ tool.name }}</div>
                    <div class="text-xs text-white/40 truncate">{{ tool.desc }}</div>
                    <div class="ml-auto text-white/30 group-hover:text-accent transition-colors text-sm">→</div>
                </a>
            </div>
        </section>

        <p class="text-xs text-white/35 text-center">
            "Access denied" on a service means your Discord roles don't include it.
        </p>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    games: [
                        { name: 'Beastworld', icon: '🐾', desc: 'Foundry VTT campaign', href: 'https://beastworld.bluefox.cafe' },
                        { name: 'Star Wars',  icon: '⚔️', desc: 'Foundry VTT campaign', href: 'https://starwars.bluefox.cafe'   },
                    ],
                    ops: [
                        { name: 'Uptime Kuma',  icon: '💓', desc: 'Service health',     href: 'https://kuma.bluefox.cafe' },
                        { name: 'Dozzle',       icon: '📜', desc: 'Container logs',     href: 'https://logs.bluefox.cafe' },
                        { name: 'Test Foundry', icon: '🧪', desc: 'Sandbox instance',   href: 'https://test.bluefox.cafe' },
                    ],
                };
            },
        }).mount('#app');
    </script>
</body>
</html>
