<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 · bluefox.cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://bluefox.cafe/shared/theme.js"></script>
    <link rel="stylesheet" href="https://bluefox.cafe/shared/theme.css">
</head>
<body class="font-sans">
    <div class="flex items-center justify-center min-h-screen p-6">
        <main class="w-full max-w-md text-center">

            <div class="relative w-24 h-24 mx-auto mb-6">
                <div class="w-24 h-24 rounded-full flex items-center justify-center text-4xl
                            shadow-float ring-1 ring-white/10
                            bg-gradient-to-br from-sides to-lining">
                    🦊
                </div>
                <div class="absolute -bottom-1 -right-1 w-9 h-9 rounded-full flex items-center justify-center text-base
                            bg-lining ring-2 ring-sides shadow-float">
                    🔒
                </div>
            </div>

            <p class="text-8xl font-black tracking-tight mb-2
                      bg-clip-text text-transparent bg-gradient-to-br from-belly to-eyes">
                403
            </p>

            <h1 class="text-2xl font-bold tracking-tight mb-1">Access denied</h1>
            <p class="text-white/60 text-sm mb-8 leading-relaxed">
                Your Discord roles don't include access to this service.<br>
                If you think this is a mistake, check with the server admin.
            </p>

            <nav class="flex flex-col gap-3">
                <a href="https://dnd.bluefox.cafe"
                   class="group relative block px-5 py-3.5 rounded-xl font-medium
                          shadow-float transition-all duration-200
                          hover:-translate-y-0.5 hover:shadow-lift
                          bg-belly text-white hover:brightness-110">
                    <span class="inline-flex items-center gap-2">
                        <span class="transition-transform group-hover:-translate-x-1">←</span>
                        Back to DnD hub
                    </span>
                </a>
                <a href="https://auth.bluefox.cafe/auth/"
                   class="group relative block px-5 py-3.5 rounded-xl font-medium
                          shadow-float transition-all duration-200
                          hover:-translate-y-0.5 hover:shadow-lift
                          bg-sides text-white ring-1 ring-white/5 hover:ring-eyes/50">
                    Sign in with a different account
                </a>
            </nav>

        </main>
    </div>
</body>
</html>
