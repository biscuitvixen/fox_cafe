<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · bluefox.cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://bluefox.cafe/shared/theme.js"></script>
    <link rel="stylesheet" href="https://bluefox.cafe/shared/theme.css">
</head>
<body class="font-sans">
    <div class="flex items-center justify-center min-h-screen p-6">
        <main class="w-full max-w-sm text-center">

            <!-- Fox avatar -->
            <div class="w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center text-4xl shadow-[0_10px_30px_-8px_rgba(0,0,0,0.55),0_2px_6px_rgba(0,0,0,0.3)] ring-1 ring-white/10"
                 style="background: linear-gradient(135deg, #302f39 0%, #1e1d28 100%);">
                🦊
            </div>

            <!-- Error code -->
            <p class="text-8xl font-bold tracking-tight mb-1"
               style="background: linear-gradient(135deg, #497bd6, #24d962);
                      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                      background-clip: text;">
                404
            </p>

            <h1 class="text-xl font-semibold mb-2">Page not found</h1>
            <p class="text-white/50 text-sm mb-8 leading-relaxed">
                This page doesn't exist or may have moved.
            </p>

            <!-- Actions -->
            <div class="flex flex-col gap-3">
                <a href="https://bluefox.cafe"
                   class="block px-5 py-3.5 rounded-xl font-medium text-white shadow-[0_10px_30px_-8px_rgba(0,0,0,0.55),0_2px_6px_rgba(0,0,0,0.3)] transition-all duration-200 hover:-translate-y-0.5 hover:brightness-110"
                   style="background-color: #497bd6;">
                    ← Go home
                </a>
                <a href="https://dnd.bluefox.cafe"
                   class="block px-5 py-3.5 rounded-xl font-medium text-white ring-1 ring-white/10 transition-all duration-200 hover:-translate-y-0.5"
                   style="background-color: #302f39;">
                    DnD hub
                </a>
            </div>

        </main>
    </div>
</body>
</html>
