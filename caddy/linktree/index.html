<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bluefox.cafe</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --accent: #4a9eff;
            --accent-hover: #6bb0ff;
            --border: #2a2f3a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            line-height: 1.5;
        }
        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a9eff 0%, #2a5d9f 100%);
            margin: 0 auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        .tagline {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        a.link {
            display: block;
            padding: 0.85rem 1.25rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: border-color 0.15s, transform 0.05s;
        }
        a.link:hover {
            border-color: var(--accent);
        }
        a.link:active {
            transform: scale(0.99);
        }
        a.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #0a0c10;
        }
        a.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        footer {
            margin-top: 2rem;
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="avatar">🦊</div>
        <h1>bluefox.cafe</h1>
        <p class="tagline">Hosting, gaming, and bits and pieces.</p>

        <nav class="links">
            <a class="link primary" href="https://services.bluefox.cafe">Services →</a>
            <!-- Edit / add your own links below -->
            <a class="link" href="https://github.com/">GitHub</a>
            <a class="link" href="https://discord.com/">Discord</a>
        </nav>

        <footer>© bluefox.cafe</footer>
    </main>
</body>
</html>
